<style>

html,body{height:100%;margin:0}

#bar{width:min(100%,960px);height:5px;background:#555;border-radius:3px;overflow:hidden}

{t:"1장. 학교의 규칙",bg:"#3b4a5a",c:["김응민","박정우","방송"],l:[["","아침. 칠판에 이상한 공지가 붙어 있다. 〈1. 규칙을 반드시 지킨다. 2. 규칙을 지나치게 의식하지 않는다. 3. 모르면 질문한다. 4. 단, 수업 중 질문은 하지 않는다. 5. 학생은 자유롭게 행동한다. 6. 단, 학교가 정한 범위 내에서 자유롭다.〉"],["김응민","……이게 무슨 말이야?"],["박정우","나도 모르겠어. 어제랑 규칙이 달라졌어."],["김응민","그럼 내일은?"],["박정우","내일은 또 바뀌겠지."],["방송","지금부터 학교 규칙이 변경됩니다."],["김응민","또?"],["방송","방금 변경된 규칙은 앞으로 변경되지 않습니다."],["김응민","다행이다."],["방송","(3초 후) 수정합니다. 변경될 수 있습니다."],["","김응민이 책상에 머리를 박는다. 쾅."],["김응민","규칙보다 내 머리가 먼저 망가질 것 같아."],["강래 사우루스","썽우…"],["김응민","방금 뭐였어?"],["박정우","에어컨 소리 아니야?"],["강래 사우루스","썽우우…"],["김응민","에어컨이 왜 썽우라고 울어?"],["#","뒤르켐의 아노미|사회 규범이 혼란스럽고 일관성이 없는 상태|구성원이 무엇을 따라야 할지 모름|→ 규칙이 3초마다 바뀌는 학교"]]},
{t:"2장. 목표는 전교 1등",bg:"#4a3535",c:["조현미 선생님","김응민","방송"],l:[["","사회문화 시간. 칠판: 〈사회적으로 인정받는 성공이란 무엇인가?〉"],["김응민","전교 1등이요."],["조현미 선생님","좋아요. 그러려면?"],["김응민","공부를 열심히 해야죠."],["조현미 선생님","정답."],["방송","긴급 공지입니다. 오늘부터 시험을 폐지합니다."],["김응민","그러면 성적은요?"],["방송","시험을 보지 않고 성적을 산출합니다. 열심히 한 학생에게 높은 점수를 줍니다."],["김응민","열심히 했는지는 어떻게 판단해요?"],["방송","선생님이 봅니다."],["조현미 선생님","……나도 모르겠는데?"],["김응민","그럼 전교 1등은요?"],["방송","반드시 존재합니다. 누가 1등인지는 아직 정하지 않았습니다."],["김응민","저 지금부터 공부 말고 다른 걸 해도 되나요? 공부해도 1등 할 보장이 없어서요."],["강래 사우루스","썽우우우우우우……"],["김응민","저 소리가 자꾸 나한테 방법을 찾으라고 하는 것 같아."],["김응민","목표는 있는데 방법이 없잖아!"],["#","머튼의 아노미|문화적 목표(전교 1등)와 제도화된 수단(공부·시험)의 괴리|목표는 강조되는데 정당한 수단이 막힘|→ 시험 폐지, 그런데 1등은 반드시 존재"]]},
{t:"3장. 스피어 등장",bg:"#10101c",c:["김응민","스피어"],l:[["","방과 후. 계단 아래에서 스피어가 나온다."],["스피어","방법을 찾고 있군."],["김응민","누구세요?"],["스피어","나는 스피어."],["김응민","학생이에요? 선생님이에요?"],["스피어","아니. ……스피어."],["김응민","그건 이름이잖아요."],["스피어","정답이다."],["김응민","대화가 왜 이래요?"],["스피어","지하로 내려와."],["김응민","보통 영화에서 지하로 내려가면 안 좋은 일이 생기잖아요."],["스피어","그건 맞아."],["김응민","그럼 왜 내려가라고 해요?"],["스피어","재미있으니까. 그리고 여기서는 시험을 안 봐."],["김응민","……갑시다."]]},

{t:"6장. 김응민의 새로운 아이디어",bg:"#3b4a5a",c:["김응민","박정우"],l:[["","김응민이 칠판에 쓴다. 〈전교 1등 프로젝트〉"],["박정우","뭐 하는 거야? 공부?"],["김응민","아니."],["","칠판 뒷면: 〈① 시험을 없앤다 ② 경쟁자를 없앤다 ③ 평가 기준을 없앤다 ④ 아무도 1등을 못 하게 한다 ⑤ 그러면 내가 상대적으로 1등이다〉"],["박정우","그건 그냥 아무도 없는 거잖아."],["김응민","그러니까 내가 1등이지."],["박정우","……너 요즘 이상해졌다."],["김응민","이상한 게 아니라 혁신이야."]]},
{t:"7장. 일탈자 김응민",bg:"#3b4a5a",c:["학생","김응민","박정우"],l:[["","김응민의 책상에 쪽지가 붙는다. 〈일탈자〉 다음 날 〈지하 인간〉 다음 날 〈썽우와 친한 사람〉"],["김응민","이건 좀 억울한데?"],["학생","저 사람 지하에서 왔다며? 강래 사우루스랑 친구라던데. 뽀삐랑 밥도 먹었다던데."],["김응민","뽀삐는 밥 안 먹어!"],["박정우","그걸 어떻게 알아?"],["김응민","……먹는 걸 본 적이 없으니까."],["박정우","그럼 너 진짜 친하네."],["김응민","다들 내가 일탈자라고 하네."],["박정우","그건 그냥 사람들이 붙인 이름이야."],["김응민","그럼……"],["김응민","진짜 일탈자가 되어주지."],["#","낙인 이론|타인이 일탈자로 규정(낙인)하면|스스로도 일탈자로 인식하게 됨|→ 이차적 일탈로 이어짐"]]},
{t:"8장. 학교의 긴급 대책",bg:"#5a5a3a",c:["조현미 선생님","배서진","박윤재","박정우"],l:[["조현미 선생님","김응민 학생의 문제를 해결해야 합니다."],["","배서진이 그래프를 공개한다. 〈김응민이 이상해진 정도〉 X축 시간, Y축 이상함. 거의 수직이다."],["배서진","명확한 증가 추세입니다."],["조현미 선생님","그래서 해결 방법은?"],["배서진","그래프를 하나 더 만들겠습니다. 이번에는 3차원으로."],["박정우","그냥 얘한테 말을 걸자고!"],["박윤재","제가 해결하겠습니다. 근육으로."],["조현미 선생님","사회문화적 문제를 왜 근육으로 해결해?"],["박윤재","모든 문제는 근육으로 해결할 수 있습니다."],["배서진","그걸 그래프로 증명할 수 있습니까?"],["박윤재","해보죠."],["조현미 선생님","둘 다 나가."]]},

{t:"10장. 열린 결말",bg:"#08080f",c:["김응민","박정우","강래 사우루스","뽀삐"],l:[["","김응민은 다시 평범한 학교생활을 시작했다. 어느 날 복도에서."],["강래 사우루스","썽우우우우우우우……"],["박정우","……들었어?"],["뽀삐","뽀뽀뽀삐삐삐……"],["","바닥에 종이 한 장. 〈내려오지 마라.〉 뒤집으면 〈……그래도 내려오고 싶다면?〉"],["박정우","버려."],["김응민","……그래."],["","김응민이 종이를 쓰레기통에 버리고 돌아간다. 3초 후 다시 돌아온다."],["박정우","왜?"],["김응민","……쓰레기 무단투기잖아."],["박정우","그걸 지금 신경 쓰냐?"],["강래 사우루스","썽우우우우우우우우우우우우……!"],["김응민","……한 번만 내려갔다 올까?"],["박정우","안 돼. 너 내려가면 또 이상해질 것 같아."],["김응민","그럼 같이 내려가. 친구니까."],["박정우","……5분만이다."],["","둘이 계단을 내려간다. 카메라는 계단 위에 남는다."],["강래 사우루스","썽우우우우우우우우우우우!!!"],["뽀삐","뽀뽀뽀삐삐삐!!!"],["박정우","야! 이게 왜 사회문화 수행평가야!"],["","[암전] END"],["#","정리|뒤르켐 아노미(규범 혼란) → 머튼 아노미(목표-수단 괴리)|→ 차별적 교제(일탈 학습) → 낙인(일탈자 규정)|웃긴 장면 하나하나가 이론 적용 사례"]]}
];
var steps=[];
S.forEach(function(s,i){if(s.t)steps.push({s:i,title:s.t});s.l.forEach(function(l){if(l[0]==='#')steps.push({s:i,th:l[1].split('|')});else steps.push({s:i,who:l[0],text:l[1]})})});
var st=document.getElementById('stage'),ti=document.getElementById('title'),bub=document.getElementById('bub'),th=document.getElementById('th'),nar=document.getElementById('narr'),ch=document.getElementById('chars');
var i=-1,playing=true,timer=null,cur=-1;
function render(){
 var d=steps[i],sc=S[d.s];
 document.getElementById('p').style.width=((i+1)/steps.length*100)+'%';
 st.style.background=sc.bg;
 if(cur!==d.s){cur=d.s;ch.innerHTML='';sc.c.forEach(function(n){var e=document.createElement('div');e.className='c';e.dataset.n=n;e.style.background=COL[n];e.textContent=n;ch.appendChild(e)})}
 bub.style.opacity=0;nar.style.opacity=0;th.style.opacity=0;
 [].forEach.call(ch.children,function(e){e.classList.remove('on','shake')});
 if(d.th){ti.style.opacity=0;th.innerHTML='<b>📌 '+d.th[0]+'</b>'+d.th.slice(1).join('<br>');th.style.opacity=1;return 5500}
 if(d.title){ti.textContent=d.title;ti.style.opacity=1;return 2000}
 ti.style.opacity=0;
 var dur=1500+d.text.length*95;
 if(!d.who){nar.textContent=d.text;nar.style.opacity=1;return dur}
 var el=[].filter.call(ch.children,function(e){return e.dataset.n===d.who})[0];
 bub.innerHTML='<span class="n">'+d.who+'</span>'+d.text;
 bub.className=/[!]{1}|우우우/.test(d.text)?'shout':'';
 if(el){el.classList.add('on');if(/우우우우|삐삐삐/.test(d.text))el.classList.add('shake');
  var sr=st.getBoundingClientRect(),er=el.getBoundingClientRect(),cx=er.left+er.width/2-sr.left;
  bub.style.opacity=1;var w=bub.offsetWidth,l=Math.max(8,Math.min(sr.width-w-8,cx-w/2));
  bub.style.left=l+'px';bub.style.top=(er.top-sr.top-bub.offsetHeight-24)+'px';bub.style.setProperty('--tx',(cx-l)+'px');
 }
 bub.style.opacity=1;return dur;
}
function go(n){clearTimeout(timer);i=Math.max(0,Math.min(steps.length-1,n));var d=render();
 if(playing&&i<steps.length-1)timer=setTimeout(function(){go(i+1)},d);
 if(i>=steps.length-1&&playing){playing=false;b2.textContent='🔁 다시보기'}}
var b2=document.getElementById('b2');
b2.onclick=function(){if(i>=steps.length-1){playing=true;b2.textContent='⏸ 일시정지';go(0);return}
 playing=!playing;b2.textContent=playing?'⏸ 일시정지':'▶ 재생';go(i)};
document.getElementById('b0').onclick=function(){cur=-1;go(0)};
document.getElementById('b1').onclick=function(){go(i-1)};
document.getElementById('b3').onclick=function(){go(i+1)};
st.onclick=function(){go(i+1)};
document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();b2.onclick()}if(e.code==='ArrowRight')go(i+1);if(e.code==='ArrowLeft')go(i-1)});
go(0);
</script></body></html>
